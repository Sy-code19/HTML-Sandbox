<!DOCTYPE html>
<html>
  <head>
    <title>Position Practice</title>
  </head>
  <body style="height: 3000px;
  padding-top: 68px;
  padding-left: 80px;
  background-color: purple;
  ">
    <div style="
      background-color: black;
      color: white;
      position: fixed;
      top: 10px;
      left: 50px;
      right: 50px;
      height: 50px;
      ">header</div>

    <div style="
      background-color: green;
      color: white;
      position: fixed;
      left: 0;
      bottom: 0;
      top: 60px;
      width: 72px;
    ">sidebar
      <div style="
        position: absolute;
        background-color: brown;
        color: white;
        top: 30px;
        right: 0px;

      ">X</div>
    </div>
    <div style="
      position: absolute;
      background-color: brown;
      color: white;
      top: 60px;
      right: 10px;

    ">absolute</div>

    <div style="
      background-color: lightblue;
      width: 200px;
      height: 200px;
      position: static;
      ">div1</div>
    <div
    style="
      background-color: lightpink;
      width: 200px;
      height: 200px;
      position: relative;
      ">div2
      <div style="
        position: absolute;
        background-color: rgb(10, 10, 10);
        color: white;
        right: 10px;
        bottom: 10px;

      ">19:32</div>
    </div>
  </body>
</html>
